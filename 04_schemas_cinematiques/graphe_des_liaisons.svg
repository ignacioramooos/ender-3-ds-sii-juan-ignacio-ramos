<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="bati-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0f172a" stroke-width="2.2" />
    </pattern>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="16" width="1240" height="54" rx="10" fill="#0f172a"/>
  <text x="40" y="49" fill="#ffffff" font-size="20" font-weight="800">GRAPHE DES LIAISONS — Imprimante 3D Creality Ender 3</text>
  <text x="1240" y="48" text-anchor="end" fill="#94a3b8" font-size="14" font-weight="600">CPGE MPSI — Lycée Stanislas Cannes</text>

  <!-- Closed Loop Highlight Zone (Boucle fermée Z) -->
  <path d="M 350 460 L 640 165 L 930 460 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="492" y="320" width="296" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="342" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="800">CHAÎNE FERMÉE D'ÉLÉVATION Z</text>
  <text x="640" y="361" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="700">Châssis fixe — Vis centrale — Traverse horizontale</text>

  <!-- ==================== EDGES (LIAISONS) ==================== -->
  <!-- L01: Châssis fixe (350, 460) to Vis centrale (640, 165) -->
  <line x1="405" y1="390" x2="570" y2="220" stroke="#2563eb" stroke-width="4.5"/>
  <!-- L12: Vis centrale (640, 165) to Traverse horizontale (930, 460) -->
  <line x1="710" y1="220" x2="875" y2="390" stroke="#dc2626" stroke-width="4.5"/>
  <!-- L02: Châssis fixe (350, 460) to Traverse horizontale (930, 460) -->
  <line x1="515" y1="460" x2="760" y2="460" stroke="#dc2626" stroke-width="4.5"/>
  <!-- L23: Traverse horizontale (930, 460) to Chariot tête extrudeur (1055, 750) -->
  <line x1="965" y1="530" x2="1030" y2="680" stroke="#16a34a" stroke-width="4.5"/>
  <!-- L04: Châssis fixe (350, 460) to Plateau mobile (225, 750) -->
  <line x1="305" y1="530" x2="250" y2="680" stroke="#f472b6" stroke-width="4.5"/>

  <!-- ==================== EDGE CALLOUT BOXES ==================== -->
  <!-- L01 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(170, 215)">
    <rect x="0" y="0" width="280" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="0" y="0" width="280" height="24" rx="6" fill="#2563eb"/>
    <text x="140" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₀₁ : Liaison Pivot d'axe (O₁, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="140" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : rotation θ₁(t) = (<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>, <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="140" y="61" text-anchor="middle" fill="#475569" font-size="11.5">Guidage en rotation du moteur stepper Z</text>
  </g>

  <!-- L12 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(825, 215)">
    <rect x="0" y="0" width="290" height="76" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="0" y="0" width="290" height="24" rx="6" fill="#dc2626"/>
    <text x="145" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₁₂ : Liaison Hélicoïdale d'axe (O₂, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="145" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Filetage à droite : pas p<tspan font-size="75%" dy="3">z</tspan><tspan dy="-3">&#8203;</tspan> = 8 mm/tr</text>
    <text x="145" y="61" text-anchor="middle" fill="#475569" font-size="11.5">Vis centrale / Écrou de la traverse horizontale</text>
  </g>

  <!-- L02 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(510, 482)">
    <rect x="0" y="0" width="260" height="76" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="0" y="0" width="260" height="24" rx="6" fill="#991b1b"/>
    <text x="130" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₀₂ : Liaison Glissière de dir. <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (en O₃)</text>
    <text x="130" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : translation verticale z₂(t)·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <text x="130" y="61" text-anchor="middle" fill="#475569" font-size="11.5">Guidage vertical sur le châssis d'aluminium</text>
  </g>

  <!-- L23 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(690, 605)">
    <rect x="0" y="0" width="265" height="76" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="0" y="0" width="265" height="24" rx="6" fill="#16a34a"/>
    <text x="132" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₂₃ : Liaison Glissière de dir. <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (en O₄)</text>
    <text x="132" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : translation horiz. x₃(t)·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <text x="132" y="61" text-anchor="middle" fill="#475569" font-size="11.5">Guidage sur la traverse horizontale (axe X)</text>
  </g>

  <!-- L04 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(30, 585)">
    <rect x="0" y="0" width="260" height="76" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="2.5"/>
    <rect x="0" y="0" width="260" height="24" rx="6" fill="#db2777"/>
    <text x="130" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₀₄ : Liaison Glissière de dir. <tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (en O₅)</text>
    <text x="130" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : translation longit. y₄(t)·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <text x="130" y="61" text-anchor="middle" fill="#475569" font-size="11.5">Guidage longitudinal sur le rail central (axe Y)</text>
  </g>

  <!-- ==================== NODES ==================== -->
  <!-- NODE 0: CHÂSSIS FIXE -->
  <g filter="url(#card-shadow)" transform="translate(350, 460)">
    <ellipse cx="0" cy="0" rx="174" ry="70" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="166" ry="62" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="0" y="-14" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="900">CHÂSSIS FIXE</text>
    <text x="0" y="10" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="700">Châssis d'aluminium,</text>
    <text x="0" y="29" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">contient l'électronique entre autres</text>
    <!-- Bati Ground Hatching Symbol underneath -->
    <line x1="35" y1="69" x2="35" y2="94" stroke="#0f172a" stroke-width="4"/>
    <line x1="-25" y1="94" x2="95" y2="94" stroke="#0f172a" stroke-width="4"/>
    <rect x="-20" y="94" width="110" height="16" fill="url(#bati-hatch)"/>
    <text x="35" y="126" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="800">Symbole du Bâti fixe</text>
  </g>

  <!-- NODE 1: VIS CENTRALE -->
  <g filter="url(#card-shadow)" transform="translate(640, 165)">
    <ellipse cx="0" cy="0" rx="168" ry="62" fill="#eff6ff" stroke="#2563eb" stroke-width="4.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#1d4ed8" font-size="20" font-weight="900">VIS CENTRALE</text>
    <text x="0" y="18" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Moteur stepper, axe Z</text>
  </g>

  <!-- NODE 2: TRAVERSE HORIZONTALE -->
  <g filter="url(#card-shadow)" transform="translate(930, 460)">
    <ellipse cx="0" cy="0" rx="174" ry="70" fill="#fef2f2" stroke="#dc2626" stroke-width="4.5"/>
    <text x="0" y="-14" text-anchor="middle" fill="#b91c1c" font-size="19" font-weight="900">TRAVERSE HORIZONTALE</text>
    <text x="0" y="10" text-anchor="middle" fill="#7f1d1d" font-size="13" font-weight="700">Bouge de haut en bas (axe Z)</text>
    <text x="0" y="29" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="600">et tient l'extrudeur</text>
  </g>

  <!-- NODE 3: CHARIOT TÊTE EXTRUDEUR -->
  <g filter="url(#card-shadow)" transform="translate(1055, 750)">
    <ellipse cx="0" cy="0" rx="174" ry="66" fill="#f0fdf4" stroke="#16a34a" stroke-width="4.5"/>
    <text x="0" y="-10" text-anchor="middle" fill="#15803d" font-size="18.5" font-weight="900">CHARIOT TÊTE EXTRUDEUR</text>
    <text x="0" y="16" text-anchor="middle" fill="#14532d" font-size="13.5" font-weight="700">Bouge sur l'axe X (droite / gauche)</text>
  </g>

  <!-- NODE 4: PLATEAU MOBILE (ROSE CLAIR) -->
  <g filter="url(#card-shadow)" transform="translate(225, 750)">
    <ellipse cx="0" cy="0" rx="174" ry="66" fill="#fdf2f8" stroke="#f472b6" stroke-width="4.5"/>
    <text x="0" y="-10" text-anchor="middle" fill="#be185d" font-size="19" font-weight="900">PLATEAU MOBILE</text>
    <text x="0" y="16" text-anchor="middle" fill="#9d174d" font-size="13.5" font-weight="700">Bouge sur l'axe Y, il est chauffé</text>
  </g>
</svg>
