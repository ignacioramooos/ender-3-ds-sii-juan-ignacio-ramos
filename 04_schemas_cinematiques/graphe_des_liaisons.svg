<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="bati-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0f172a" stroke-width="2.2" />
    </pattern>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="16" width="1240" height="54" rx="10" fill="#0f172a"/>
  <text x="40" y="49" fill="#ffffff" font-size="20" font-weight="800">GRAPHE DES LIAISONS NORMALISÉ — Imprimante 3D Creality Ender 3</text>
  <text x="1240" y="48" text-anchor="end" fill="#94a3b8" font-size="14" font-weight="600">CPGE MPSI — Norme AFNOR NF EN ISO 3952</text>

  <!-- Closed Loop Highlight Zone (Boucle fermée Z : E0 - E1 - E2 - E0) -->
  <path d="M 350 440 L 640 155 L 930 440 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="502" y="305" width="276" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="327" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="800">CHAÎNE FERMÉE D'ÉLÉVATION Z</text>
  <text x="640" y="346" text-anchor="middle" fill="#2563eb" font-size="12.5" font-weight="700" font-family="Georgia, serif">{V(E₂/E₀)} = {V(E₂/E₁)} + {V(E₁/E₀)}</text>

  <!-- ==================== EDGES (LIAISONS) ==================== -->
  <!-- L01: E0 (350, 440) to E1 (640, 155) -->
  <line x1="405" y1="370" x2="570" y2="210" stroke="#2563eb" stroke-width="4.5"/>
  <!-- L12: E1 (640, 155) to E2 (930, 440) -->
  <line x1="710" y1="210" x2="875" y2="370" stroke="#dc2626" stroke-width="4.5"/>
  <!-- L02: E0 (350, 440) to E2 (930, 440) -->
  <line x1="515" y1="440" x2="760" y2="440" stroke="#dc2626" stroke-width="4.5"/>
  <!-- L23: E2 (930, 440) to E3 (1065, 755) -->
  <line x1="965" y1="514" x2="1035" y2="683" stroke="#16a34a" stroke-width="4.5"/>
  <!-- L04: E0 (350, 440) to E4 (215, 755) -->
  <line x1="305" y1="514" x2="240" y2="683" stroke="#ea580c" stroke-width="4.5"/>

  <!-- ==================== EDGE CALLOUT BOXES ==================== -->
  <!-- L01 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(175, 205)">
    <rect x="0" y="0" width="275" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="0" y="0" width="275" height="24" rx="6" fill="#2563eb"/>
    <text x="137" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₀₁ : Liaison Pivot d'axe (O₁, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="137" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : rotation θ₁(t) = (<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>, <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="137" y="61" text-anchor="middle" fill="#475569" font-size="11.5">Guidage interne par roulements du moteur Z</text>
  </g>

  <!-- L12 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(825, 205)">
    <rect x="0" y="0" width="290" height="76" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="0" y="0" width="290" height="24" rx="6" fill="#dc2626"/>
    <text x="145" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₁₂ : Liaison Hélicoïdale d'axe (O₂, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="145" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Filetage à droite : pas p<tspan font-size="75%" dy="3">z</tspan><tspan dy="-3">&#8203;</tspan> = 8 mm/tr</text>
    <text x="145" y="61" text-anchor="middle" fill="#475569" font-size="11.5">Vis trapézoïdale Tr8x8 (E₁) / Écrou laiton (E₂)</text>
  </g>

  <!-- L02 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(510, 462)">
    <rect x="0" y="0" width="255" height="76" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="0" y="0" width="255" height="24" rx="6" fill="#991b1b"/>
    <text x="127" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₀₂ : Liaison Glissière de dir. <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (en O₃)</text>
    <text x="127" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : translation verticale z₂(t)·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <text x="127" y="61" text-anchor="middle" fill="#475569" font-size="11.5">6 galets V-wheels sur les 2 montants 2040</text>
  </g>

  <!-- L23 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(715, 575)">
    <rect x="0" y="0" width="265" height="76" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="0" y="0" width="265" height="24" rx="6" fill="#16a34a"/>
    <text x="132" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₂₃ : Liaison Glissière de dir. <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (en O₄)</text>
    <text x="132" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : translation horiz. x₃(t)·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <text x="132" y="61" text-anchor="middle" fill="#475569" font-size="11.5">3 galets V-wheels sur profilé X 2020</text>
  </g>

  <!-- L04 Label Box -->
  <g filter="url(#card-shadow)" transform="translate(22, 575)">
    <rect x="0" y="0" width="255" height="76" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="0" y="0" width="255" height="24" rx="6" fill="#ea580c"/>
    <text x="127" y="17" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">L₀₄ : Liaison Glissière de dir. <tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (en O₅)</text>
    <text x="127" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Paramètre : translation longit. y₄(t)·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <text x="127" y="61" text-anchor="middle" fill="#475569" font-size="11.5">4 galets V-wheels sur rail central Y 2040</text>
  </g>

  <!-- ==================== NODES (CLASSES D'ÉQUIVALENCE) ==================== -->
  <!-- NODE E0: BÂTI FIXE -->
  <g filter="url(#card-shadow)" transform="translate(350, 440)">
    <ellipse cx="0" cy="0" rx="174" ry="80" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="166" ry="72" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="0" y="-36" text-anchor="middle" fill="#0f172a" font-size="18.5" font-weight="900">E₀ — BÂTI FIXE [Repère R₀]</text>
    <text x="0" y="-16" text-anchor="middle" fill="#1e293b" font-size="11.5" font-weight="700">• Châssis profilés alu V-Slot (4040 / 2040 / 2020)</text>
    <text x="0" y="1" text-anchor="middle" fill="#1e293b" font-size="11.5" font-weight="700">• Stators des moteurs pas-à-pas NEMA 17 Z et Y</text>
    <text x="0" y="18" text-anchor="middle" fill="#334155" font-size="11.5">• Alimentation 24V, boîtier carte mère, écran LCD</text>
    <text x="0" y="35" text-anchor="middle" fill="#334155" font-size="11">• Capteurs Z/Y-Endstop, tendeur Y, porte-bobine</text>
    <!-- Normalized Bati Ground Hatching Symbol underneath right side of E0 -->
    <line x1="35" y1="79" x2="35" y2="104" stroke="#0f172a" stroke-width="4"/>
    <line x1="-25" y1="104" x2="95" y2="104" stroke="#0f172a" stroke-width="4"/>
    <rect x="-20" y="104" width="110" height="16" fill="url(#bati-hatch)"/>
    <text x="35" y="136" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="800">Symbole normalisé du Bâti fixe</text>
  </g>

  <!-- NODE E1: VIS MÈRE Z -->
  <g filter="url(#card-shadow)" transform="translate(640, 155)">
    <ellipse cx="0" cy="0" rx="172" ry="66" fill="#eff6ff" stroke="#2563eb" stroke-width="4.5"/>
    <text x="0" y="-26" text-anchor="middle" fill="#1d4ed8" font-size="18.5" font-weight="900">E₁ — ARBRE &amp; VIS MÈRE Z [R₁]</text>
    <text x="0" y="-5" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="700">• Rotor et arbre (∅5 mm) du moteur Z</text>
    <text x="0" y="13" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="700">• Coupleur rigide fendu en alu + 2 vis CHC M3</text>
    <text x="0" y="31" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700">• Vis trapézoïdale inox Tr8x8 (p<tspan font-size="75%" dy="3">z</tspan><tspan dy="-3">&#8203;</tspan> = 8 mm/tr)</text>
  </g>

  <!-- NODE E2: PORTIQUE MOBILE X -->
  <g filter="url(#card-shadow)" transform="translate(930, 440)">
    <ellipse cx="0" cy="0" rx="170" ry="76" fill="#fef2f2" stroke="#dc2626" stroke-width="4.5"/>
    <text x="0" y="-34" text-anchor="middle" fill="#b91c1c" font-size="18.5" font-weight="900">E₂ — PORTIQUE MOBILE X [R₂]</text>
    <text x="0" y="-14" text-anchor="middle" fill="#7f1d1d" font-size="11.5" font-weight="700">• Profilé alu horizontal X 2020 V-Slot</text>
    <text x="0" y="3" text-anchor="middle" fill="#7f1d1d" font-size="11.5" font-weight="700">• Platines Z gauche/droite + Écrou laiton Tr8x8</text>
    <text x="0" y="20" text-anchor="middle" fill="#991b1b" font-size="11.5">• Axes/entretoises des 6 galets V-wheels Z</text>
    <text x="0" y="37" text-anchor="middle" fill="#991b1b" font-size="11.5">• Stator moteur X, X-Endstop, corps extrudeur MK8</text>
  </g>

  <!-- NODE E3: CHARIOT TÊTE D'IMPRESSION -->
  <g filter="url(#card-shadow)" transform="translate(1065, 755)">
    <ellipse cx="0" cy="0" rx="172" ry="74" fill="#f0fdf4" stroke="#16a34a" stroke-width="4.5"/>
    <text x="0" y="-32" text-anchor="middle" fill="#15803d" font-size="18" font-weight="900">E₃ — CHARIOT TÊTE X [R₃]</text>
    <text x="0" y="-12" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="700">• Platine chariot X + axes des 3 galets V-wheels X</text>
    <text x="0" y="5" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="700">• Radiateur rouge, heatbreak, bloc de chauffe</text>
    <text x="0" y="22" text-anchor="middle" fill="#166534" font-size="11.5" font-weight="700">• Buse laiton ∅0,4 mm + raccord PC4-M10</text>
    <text x="0" y="39" text-anchor="middle" fill="#166534" font-size="11.5">• Carénage acier et stators des 2 ventilateurs 4010</text>
  </g>

  <!-- NODE E4: PLATEAU CHAUFFANT Y -->
  <g filter="url(#card-shadow)" transform="translate(215, 755)">
    <ellipse cx="0" cy="0" rx="172" ry="74" fill="#fff7ed" stroke="#ea580c" stroke-width="4.5"/>
    <text x="0" y="-32" text-anchor="middle" fill="#c2410c" font-size="18" font-weight="900">E₄ — PLATEAU MOBILE Y [R₄]</text>
    <text x="0" y="-12" text-anchor="middle" fill="#7c2d12" font-size="11.5" font-weight="700">• Platine chariot Y + axes des 4 galets V-wheels Y</text>
    <text x="0" y="5" text-anchor="middle" fill="#7c2d12" font-size="11.5" font-weight="700">• 4 vis M4 et molettes crantées (fixes en impr.)</text>
    <text x="0" y="22" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="700">• Plaque alu chauffante 235×235 mm (24V/220W)</text>
    <text x="0" y="39" text-anchor="middle" fill="#9a3412" font-size="11.5">• Revêtement BuildTak et 4 pinces métalliques</text>
  </g>

  <!-- Bottom note on kinematic structure -->
  <rect x="415" y="715" width="450" height="105" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="740" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="800">ANALYSE TOPOLOGIQUE DU GRAPHE DES LIAISONS</text>
  <text x="640" y="762" text-anchor="middle" fill="#334155" font-size="12">• 5 Classes d'équivalence (E₀ à E₄) et 5 Liaisons mécaniques</text>
  <text x="640" y="782" text-anchor="middle" fill="#334155" font-size="12">• 3 familles de liaisons distinctes : Pivot (L₀₁), Hélicoïdale (L₁₂), Glissière (L₀₂, L₂₃, L₀₄)</text>
  <text x="640" y="802" text-anchor="middle" fill="#334155" font-size="12">• 1 chaîne fermée (E₀–E₁–E₂–E₀, axe Z) + 2 chaînes ouvertes (E₂–E₃ et E₀–E₄)</text>
</svg>
