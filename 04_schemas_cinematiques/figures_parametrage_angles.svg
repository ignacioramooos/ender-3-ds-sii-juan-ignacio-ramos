<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500" width="1150" height="500" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="p-blk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="p-blu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="p-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="p-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="p-pnk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <marker id="p-pur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="16" width="1110" height="50" rx="10" fill="#0f172a"/>
  <text x="40" y="47" fill="#ffffff" font-size="19" font-weight="800">PARAMÉTRAGE CINÉMATIQUE : Figure Plane de Changement de Base &amp; Chaîne Vectorielle des Centres</text>

  <!-- LEFT PANEL: Planar Projection Figure for theta_1(t) (B0 -> B1) -->
  <rect x="20" y="80" width="520" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="280" y="110" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">1. Figure plane de changement de base (B₀ → B₁)</text>
  <text x="280" y="130" text-anchor="middle" fill="#475569" font-size="12.5" font-weight="600">Liaison Pivot L₀₁ d'axe (O₁, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>) entre le Châssis fixe et la Vis centrale</text>

  <g transform="translate(220, 315)">
    <!-- Base B0 (Black): x0 horizontal right, y0 vertical up -->
    <line x1="0" y1="0" x2="155" y2="0" stroke="#0f172a" stroke-width="3" marker-end="url(#p-blk)"/>
    <text x="165" y="5" fill="#0f172a" font-size="16" font-weight="800"><tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <line x1="0" y1="0" x2="0" y2="-155" stroke="#0f172a" stroke-width="3" marker-end="url(#p-blk)"/>
    <text x="-8" y="-165" fill="#0f172a" font-size="16" font-weight="800"><tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Base B1 (Blue, rotated by theta_1 = 32 deg counter-clockwise): -->
    <line x1="0" y1="0" x2="131" y2="-82" stroke="#2563eb" stroke-width="3" marker-end="url(#p-blu)"/>
    <text x="140" y="-84" fill="#2563eb" font-size="16" font-weight="800"><tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan></text>

    <line x1="0" y1="0" x2="-82" y2="-131" stroke="#2563eb" stroke-width="3" marker-end="url(#p-blu)"/>
    <text x="-95" y="-138" fill="#2563eb" font-size="16" font-weight="800"><tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Angle arc theta_1(t) between x0 and x1 (radius 95) -->
    <path d="M 95 0 A 95 95 0 0 0 80.5 -50.3" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#p-blu)"/>
    <text x="108" y="-22" fill="#2563eb" font-size="15" font-weight="800" font-style="italic">θ₁(t)</text>

    <!-- Angle arc theta_1(t) between y0 and y1 (radius 95) -->
    <path d="M 0 -95 A 95 95 0 0 0 -50.3 -80.5" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#p-blu)"/>
    <text x="-38" y="-102" fill="#2563eb" font-size="15" font-weight="800" font-style="italic">θ₁(t)</text>

    <!-- Z0 = Z1 sortant (circle with dot) at origin O1 -->
    <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#0f172a"/>
    <text x="-15" y="28" fill="#0f172a" font-size="14" font-weight="800">O₁ : <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> = <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan> (sortant ⊙)</text>
  </g>

  <!-- Formulas box in Left Panel -->
  <rect x="40" y="365" width="480" height="98" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="280" y="388" text-anchor="middle" fill="#1e3a8a" font-size="13.5" font-weight="800">Projections dans B₀ et Vecteur Taux de Rotation :</text>
  <text x="280" y="412" text-anchor="middle" fill="#0f172a" font-size="13" font-family="Georgia, serif" font-weight="700"><tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan> = cos θ₁(t)·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> + sin θ₁(t)·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>   |   <tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan> = −sin θ₁(t)·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> + cos θ₁(t)·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
  <text x="280" y="436" text-anchor="middle" fill="#2563eb" font-size="14" font-family="Georgia, serif" font-weight="700"><tspan font-weight="900">Ω</tspan><tspan dx="-0.68em" dy="-8.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="0.12em" dy="8.5">&#8203;</tspan>(Vis / Châssis) = <tspan font-style="italic" font-weight="800">θ</tspan><tspan dx="-0.48em" dy="-7.5" font-size="85%" font-style="normal" font-weight="900">·</tspan><tspan dx="0.08em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan>(t)·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> = ω₁₀(t)·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
  <text x="280" y="455" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="600">La Traverse, le Chariot et le Plateau étant en translation par rapport au Châssis : même base B₀</text>

  <!-- RIGHT PANEL: Vector Chain O0 -> O1 -> O2 -> O3 -> O4 and O0 -> O5 -->
  <rect x="560" y="80" width="570" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="845" y="110" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">2. Chaîne Vectorielle des Centres Géométriques O₀ à O₅</text>
  <text x="845" y="130" text-anchor="middle" fill="#475569" font-size="12.5" font-weight="600">Fermeture géométrique entre le Chariot tête extrudeur (O₄) et le Plateau mobile (O₅)</text>

  <!-- Schematic Vector Graph inside Right Panel -->
  <g transform="translate(580, 145)">
    <!-- Vector O0 -> O1 -->
    <line x1="220" y1="220" x2="88" y2="192" stroke="#0f172a" stroke-width="2.5" marker-end="url(#p-blk)"/>
    <text x="135" y="222" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">−L<tspan font-size="75%" dy="3">x</tspan><tspan dy="-3">&#8203;</tspan>·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> + h₁·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Vector O1 -> O2 (along z0) -->
    <line x1="80" y1="190" x2="80" y2="75" stroke="#2563eb" stroke-width="3" marker-end="url(#p-blu)"/>
    <text x="68" y="135" text-anchor="end" fill="#2563eb" font-size="13" font-weight="800">z₂(t)·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Vector O2 -> O3 (along x0) -->
    <line x1="80" y1="65" x2="210" y2="65" stroke="#dc2626" stroke-width="2.5" marker-end="url(#p-red)"/>
    <text x="145" y="55" text-anchor="middle" fill="#dc2626" font-size="12.5" font-weight="800">+L<tspan font-size="75%" dy="3">x</tspan><tspan dy="-3">&#8203;</tspan>·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Direct Vector O0 -> O3 (along z0) -->
    <line x1="220" y1="220" x2="220" y2="75" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#p-red)"/>
    <text x="230" y="150" fill="#b91c1c" font-size="12.5" font-weight="700">(h₁ + z₂(t))·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Vector O3 -> O4 (along x0 + dy y0) -->
    <line x1="220" y1="65" x2="400" y2="65" stroke="#16a34a" stroke-width="3" marker-end="url(#p-grn)"/>
    <text x="310" y="53" text-anchor="middle" fill="#15803d" font-size="13" font-weight="800">x₃(t)·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> + d<tspan font-size="75%" dy="3">y</tspan><tspan dy="-3">&#8203;</tspan>·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Vector O0 -> O5 (along y0 + h5 z0) -->
    <line x1="220" y1="220" x2="350" y2="197" stroke="#ec4899" stroke-width="3" marker-end="url(#p-pnk)"/>
    <text x="305" y="226" text-anchor="middle" fill="#be185d" font-size="13" font-weight="800">y₄(t)·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> + h₅·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>

    <!-- Resulting Relative Position Vector O5 -> O4 -->
    <line x1="360" y1="195" x2="407" y2="75" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="6 3" marker-end="url(#p-pur)"/>
    <text x="402" y="145" fill="#6d28d9" font-size="14" font-weight="900"><tspan font-weight="900" text-decoration="overline">O₅O₄</tspan> (Buse / Plateau)</text>

    <!-- Nodes -->
    <circle cx="220" cy="220" r="7" fill="#0f172a"/><text x="220" y="242" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="800">O₀ (Châssis)</text>
    <circle cx="80" cy="190" r="7" fill="#2563eb"/><text x="55" y="195" text-anchor="end" fill="#2563eb" font-size="13" font-weight="800">O₁ (L₀₁)</text>
    <circle cx="80" cy="65" r="7" fill="#dc2626"/><text x="55" y="70" text-anchor="end" fill="#dc2626" font-size="13" font-weight="800">O₂ (L₁₂)</text>
    <circle cx="220" cy="65" r="7" fill="#dc2626"/><text x="220" y="42" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="800">O₃ (L₀₂)</text>
    <circle cx="410" cy="65" r="7" fill="#16a34a"/><text x="425" y="69" fill="#16a34a" font-size="12.5" font-weight="800">O₄ (Chariot)</text>
    <circle cx="360" cy="195" r="7" fill="#f472b6"/><text x="375" y="200" fill="#db2777" font-size="12.5" font-weight="800">O₅ (Plateau)</text>
  </g>

  <!-- Vector closure equation box -->
  <rect x="580" y="395" width="530" height="68" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="845" y="418" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="800">Vecteur Position Relative du Chariot tête extrudeur par rapport au Plateau mobile dans B₀ :</text>
  <text x="845" y="444" text-anchor="middle" fill="#0f172a" font-size="14" font-family="Georgia, serif" font-weight="700"><tspan font-weight="900" text-decoration="overline">O₅O₄</tspan> = x₃(t)·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> + (d<tspan font-size="75%" dy="3">y</tspan><tspan dy="-3">&#8203;</tspan> − y₄(t))·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> + (h₁ − h₅ + z₂(t))·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
</svg>
