<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="arr-blu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-pnk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <pattern id="hatch-2d" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0f172a" stroke-width="1.8" />
    </pattern>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="16" width="1140" height="54" rx="10" fill="#0f172a"/>
  <text x="40" y="49" fill="#ffffff" font-size="19" font-weight="800">SCHÉMA CINÉMATIQUE MINIMAL 2D EN COULEUR — Projection frontale (O₀, <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
  <text x="1140" y="48" text-anchor="end" fill="#94a3b8" font-size="14" font-weight="600">CPGE MPSI — Lycée Stanislas Cannes</text>

  <!-- Color Legend Strip -->
  <g transform="translate(20, 82)">
    <rect x="0" y="0" width="1140" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="7" fill="#0f172a"/><text x="36" y="24" fill="#0f172a" font-size="12.5" font-weight="800">Châssis fixe (Noir)</text>
    <circle cx="205" cy="19" r="7" fill="#2563eb"/><text x="217" y="24" fill="#2563eb" font-size="12.5" font-weight="800">Vis centrale (Bleu)</text>
    <circle cx="400" cy="19" r="7" fill="#dc2626"/><text x="412" y="24" fill="#dc2626" font-size="12.5" font-weight="800">Traverse horizontale (Rouge)</text>
    <circle cx="655" cy="19" r="7" fill="#16a34a"/><text x="667" y="24" fill="#16a34a" font-size="12.5" font-weight="800">Chariot tête extrudeur (Vert)</text>
    <circle cx="915" cy="19" r="7" fill="#f472b6"/><text x="927" y="24" fill="#db2777" font-size="12.5" font-weight="800">Plateau mobile (Rose clair)</text>
  </g>

  <!-- ==================== 1. ORTHONORMAL DIRECT TRIHEDRON R0 ==================== -->
  <g transform="translate(85, 650)">
    <rect x="-55" y="-125" width="185" height="175" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="37" y="-102" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="800">Repère direct R₀ (Châssis fixe)</text>
    <!-- Z0 Up -->
    <line x1="15" y1="0" x2="15" y2="-75" stroke="#0f172a" stroke-width="3" marker-end="url(#arr-blk)"/>
    <text x="-15" y="-66" fill="#0f172a" font-size="16" font-weight="800"><tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <!-- X0 Right -->
    <line x1="15" y1="0" x2="90" y2="0" stroke="#0f172a" stroke-width="3" marker-end="url(#arr-blk)"/>
    <text x="97" y="5" fill="#0f172a" font-size="16" font-weight="800"><tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <!-- Y0 Entrant (Circle with Cross: y0 = z0 ^ x0) -->
    <circle cx="-22" cy="-22" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="-29" y1="-29" x2="-15" y2="-15" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="-29" y1="-15" x2="-15" y2="-29" stroke="#0f172a" stroke-width="2.5"/>
    <text x="-42" y="22" fill="#0f172a" font-size="13" font-weight="800"><tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (entrant ⊗)</text>
    <text x="-42" y="40" fill="#475569" font-size="11.5" font-weight="600">car <tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> = <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> ∧ <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
  </g>

  <!-- ==================== 2. CHÂSSIS FIXE (NOIR) ==================== -->
  <!-- Base horizontal frame line -->
  <line x1="250" y1="650" x2="980" y2="650" stroke="#0f172a" stroke-width="4.5"/>
  <rect x="260" y="650" width="710" height="16" fill="url(#hatch-2d)"/>
  <!-- Origin O0 on the base axis at x = 740 -->
  <circle cx="740" cy="650" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="740" y="685" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="800">O₀ (Origine R₀ sur le Châssis fixe)</text>

  <!-- Left vertical guide column of Châssis fixe (axis of Glissiere L02, x = 310) -->
  <line x1="310" y1="650" x2="310" y2="165" stroke="#0f172a" stroke-width="4.5"/>
  <!-- Top ground cap on left column -->
  <line x1="280" y1="165" x2="340" y2="165" stroke="#0f172a" stroke-width="4"/>
  <rect x="280" y="149" width="60" height="16" fill="url(#hatch-2d)"/>
  <text x="272" y="160" text-anchor="end" fill="#0f172a" font-size="14" font-weight="800">Châssis fixe</text>

  <!-- Arm from Châssis fixe base to Pivot L01 center O1 (x = 420, y = 545) -->
  <polyline points="310,595 420,595 420,588" fill="none" stroke="#0f172a" stroke-width="4"/>

  <!-- ==================== 3. LIAISON PIVOT L01 (O1, z0) & VIS CENTRALE (BLEU) ==================== -->
  <!-- Centerline of Z screw (O1 - O2) at x = 420 -->
  <line x1="420" y1="625" x2="420" y2="155" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="420" y="145" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="800">Axe (O₁, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>) = (O₂, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>

  <!-- Continuous rotating shaft + screw Vis centrale (Blue) -->
  <line x1="420" y1="600" x2="420" y2="180" stroke="#2563eb" stroke-width="4.5"/>
  <text x="432" y="196" fill="#2563eb" font-size="14.5" font-weight="800">Vis centrale (axe Z)</text>

  <!-- 2D Symbol for L01: Pivot of axis (O1, z0) at (420, 545) -->
  <g transform="translate(420, 545)">
    <rect x="-18" y="-32" width="36" height="64" fill="#ffffff" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="-28" y="-20" width="10" height="40" fill="url(#hatch-2d)"/>
    <line x1="-18" y1="-20" x2="-18" y2="20" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#2563eb" stroke-width="4.5"/>
    <line x1="-13" y1="-38" x2="13" y2="-38" stroke="#2563eb" stroke-width="4"/>
    <line x1="-13" y1="38" x2="13" y2="38" stroke="#2563eb" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="-375" y="-108" width="245" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <polyline points="-130,-83 -60,-83 -20,-12" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="-252" y="-88" text-anchor="middle" fill="#1d4ed8" font-size="13.5" font-weight="800">L₀₁ : Pivot d'axe (O₁, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="-252" y="-68" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Moteur stepper, axe Z</text>
    <path d="M -16 -56 A 20 8 0 1 0 16 -56" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blu)"/>
    <text x="26" y="-52" fill="#2563eb" font-size="13.5" font-weight="800">θ₁(t) = (<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>, <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">1</tspan><tspan dy="-3">&#8203;</tspan>)</text>
  </g>

  <!-- ==================== 4. TRAVERSE HORIZONTALE (ROUGE) : GLISSIÈRE L02 (O3) & HÉLICOÏDALE L12 (O2) ==================== -->
  <!-- Gantry elevation level: y = 340 -->
  <line x1="330" y1="340" x2="400" y2="340" stroke="#dc2626" stroke-width="5"/>
  <line x1="440" y1="340" x2="960" y2="340" stroke="#dc2626" stroke-width="5"/>
  <text x="895" y="324" fill="#dc2626" font-size="15" font-weight="800">Traverse horizontale</text>

  <!-- 2D Symbol for L02: Glissière of direction z0 at O3 (310, 340) -->
  <g transform="translate(310, 340)">
    <rect x="-20" y="-38" width="40" height="76" fill="#ffffff" stroke="#dc2626" stroke-width="3.5"/>
    <line x1="-20" y1="-38" x2="20" y2="38" stroke="#dc2626" stroke-width="2.2"/>
    <line x1="-20" y1="38" x2="20" y2="-38" stroke="#dc2626" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <line x1="-36" y1="38" x2="-36" y2="-38" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-red)"/>
    <text x="-46" y="4" text-anchor="end" fill="#dc2626" font-size="14" font-weight="800">z₂(t)·<tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <rect x="-265" y="-68" width="215" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="-157" y="-48" text-anchor="middle" fill="#991b1b" font-size="13.5" font-weight="800">L₀₂ : Glissière (O₃, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="-157" y="-30" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="700">Guidage vertical (axe Z)</text>
  </g>

  <!-- 2D Symbol for L12: Hélicoïdale of axis (O2, z0) at O2 (420, 340) -->
  <g transform="translate(420, 340)">
    <rect x="-20" y="-36" width="40" height="72" fill="#ffffff" stroke="#dc2626" stroke-width="3.5"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#2563eb" stroke-width="4"/>
    <line x1="-18" y1="-16" x2="18" y2="4" stroke="#2563eb" stroke-width="3"/>
    <line x1="-18" y1="2" x2="18" y2="22" stroke="#2563eb" stroke-width="3"/>
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <rect x="26" y="-122" width="235" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="12" y1="-36" x2="36" y2="-72" stroke="#dc2626" stroke-width="2"/>
    <text x="143" y="-101" text-anchor="middle" fill="#991b1b" font-size="13.5" font-weight="800">L₁₂ : Hélicoïdale d'axe (O₂, <tspan font-style="italic" font-weight="800">z</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>
    <text x="143" y="-82" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">Filet à droite : pas p<tspan font-size="75%" dy="3">z</tspan><tspan dy="-3">&#8203;</tspan> = 8 mm/tr</text>
  </g>

  <!-- ==================== 5. CHARIOT TÊTE EXTRUDEUR (VERT) : GLISSIÈRE L23 (O4) ==================== -->
  <!-- Center O4 at (740, 340) along the horizontal gantry -->
  <g transform="translate(740, 340)">
    <rect x="-42" y="-20" width="84" height="40" fill="#ffffff" stroke="#16a34a" stroke-width="3.5"/>
    <line x1="-42" y1="-20" x2="42" y2="20" stroke="#16a34a" stroke-width="2.2"/>
    <line x1="-42" y1="20" x2="42" y2="-20" stroke="#16a34a" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <line x1="-42" y1="-34" x2="45" y2="-34" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-grn)"/>
    <text x="54" y="-29" fill="#16a34a" font-size="14" font-weight="800">x₃(t)·<tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan></text>
    <text x="0" y="-52" text-anchor="middle" fill="#15803d" font-size="14" font-weight="800">L₂₃ : Glissière (O₄, <tspan font-style="italic" font-weight="800">x</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan>)</text>

    <line x1="0" y1="20" x2="0" y2="78" stroke="#16a34a" stroke-width="4.5"/>
    <polygon points="-16,78 16,78 0,108" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="24" y="88" fill="#15803d" font-size="14" font-weight="800">Chariot tête extrudeur</text>
  </g>

  <!-- ==================== 6. PLATEAU MOBILE (ROSE CLAIR) : GLISSIÈRE L04 (O5) VUE EN BOUT ==================== -->
  <!-- Center O5 at (740, 595) above O0 (740, 650) -->
  <line x1="740" y1="650" x2="740" y2="613" stroke="#0f172a" stroke-width="4.5"/>
  <g transform="translate(740, 595)">
    <rect x="-32" y="-18" width="64" height="36" fill="#ffffff" stroke="#ec4899" stroke-width="3.5"/>
    <rect x="-20" y="-10" width="40" height="20" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <line x1="-20" y1="-10" x2="20" y2="10" stroke="#0f172a" stroke-width="2"/>
    <line x1="-20" y1="10" x2="20" y2="-10" stroke="#0f172a" stroke-width="2"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#ec4899" stroke-width="2.5"/>

    <line x1="0" y1="-18" x2="0" y2="-42" stroke="#ec4899" stroke-width="4.5"/>
    <line x1="-135" y1="-42" x2="135" y2="-42" stroke="#f472b6" stroke-width="6"/>
    <line x1="-135" y1="-50" x2="-135" y2="-34" stroke="#ec4899" stroke-width="3.5"/>
    <line x1="135" y1="-50" x2="135" y2="-34" stroke="#ec4899" stroke-width="3.5"/>

    <circle cx="-55" cy="0" r="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
    <line x1="-62" y1="-7" x2="-48" y2="7" stroke="#ec4899" stroke-width="2.5"/>
    <line x1="-62" y1="7" x2="-48" y2="-7" stroke="#ec4899" stroke-width="2.5"/>
    <text x="-72" y="5" text-anchor="end" fill="#be185d" font-size="14" font-weight="800">y₄(t)·<tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> (⊗)</text>

    <text x="148" y="-37" fill="#db2777" font-size="15" font-weight="800">Plateau mobile (axe Y, chauffé)</text>
    <rect x="46" y="-16" width="315" height="46" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
    <text x="203" y="4" text-anchor="middle" fill="#9d174d" font-size="13.5" font-weight="800">L₀₄ : Glissière de dir. <tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> en O₅</text>
    <text x="203" y="22" text-anchor="middle" fill="#be185d" font-size="11.5" font-weight="700">Vue en bout (axe <tspan font-style="italic" font-weight="800">y</tspan><tspan dx="-0.56em" dy="-7.5" font-size="70%" font-style="normal" font-weight="800">→</tspan><tspan dx="-0.04em" dy="10.5" font-size="74%" font-style="normal" font-weight="800">0</tspan><tspan dy="-3">&#8203;</tspan> ⊥ au plan de projection)</text>
  </g>

  <!-- Vector closure indicator between Nozzle (O4) and Bed (O5) -->
  <line x1="740" y1="452" x2="740" y2="548" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-blk)"/>
  <text x="752" y="505" fill="#334155" font-size="12.5" font-weight="700" font-style="italic">Point d'impression (Chariot tête extrudeur / Plateau mobile)</text>
</svg>
